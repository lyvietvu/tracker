<style>

const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function open_(user, pass) {
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(user + "\n" + pass), "PBKDF2", false, ["deriveKey"]);
  const key = await crypto.subtle.deriveKey({name: "PBKDF2", salt: b64(P.salt), iterations: P.iter, hash: "SHA-256"}, base, {name: "AES-GCM", length: 256}, false, ["decrypt"]);
  const plain = await crypto.subtle.decrypt({name: "AES-GCM", iv: b64(P.iv)}, key, b64(P.ct));
  return new TextDecoder().decode(plain);
}

  const b = document.getElementById("b"), err = document.getElementById("err");

  try {
    const html = await open_(document.getElementById("u").value.trim(), document.getElementById("p").value);
    document.open(); document.write(html); document.close();
  } catch (x) {
    err.textContent = "Wrong username or password."; b.disabled = false; b.textContent = "Open";
  }
});
